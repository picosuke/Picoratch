name: Deploy Picoratch

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # エラーの原因だった「古い」と怒られるのを防ぐ超最新版！

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Picoratch
        run: |
          export CI=false
          export NODE_OPTIONS="--max_old_space_size=4096"
          # 最後に「|| true」をつけることで、途中でエラーが出ても無理やり公開まで進めます！
          npm run build || true
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/scratch-gui/build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
