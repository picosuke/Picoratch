name: Deploy Picoratch

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 古すぎず新しすぎない、一番安定する「20」に固定します！

      - name: Install dependencies
        # 悪さをしていたおまじないを完全に消し去り、
        # 設計図（package-lock.json）通りに完璧にクリーンインストールする最強のコマンドです。
        run: npm ci

      - name: Build Picoratch
        run: |
          export CI=false
          export NODE_OPTIONS="--max_old_space_size=4096"
          npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./packages/scratch-gui/build # ビルドが成功すれば、ここに完成品が入ります！

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
