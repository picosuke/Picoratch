name: Deploy Picoratch

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Picoratch
        # CI: false を入れることで、小さな警告でビルドが止まるのを防ぎます
        # NODE_OPTIONS でメモリ不足を防ぎます
        run: |
          export CI=false
          export NODE_OPTIONS="--max_old_space_size=4096"
          npm run build
        env:
          NODE_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
